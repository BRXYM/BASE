openapi: "3.1.0"
info:
  title: "SpringBase API"
  description: "SpringBase API"
  version: "1.0.0"
servers:
  - url: "https://SpringBase"
paths:
  /admController/executeDeleteSql:
    post:
      summary: "POST admController/executeDeleteSql"
      operationId: "executeDeleteSql"
      requestBody:
        content:
          application/json:
            schema:
              type: "string"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Result"
  /admController/executeInsertSql:
    post:
      summary: "POST admController/executeInsertSql"
      operationId: "executeInsertSql"
      requestBody:
        content:
          application/json:
            schema:
              type: "string"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Result"
  /admController/executeSelectSql:
    post:
      summary: "POST admController/executeSelectSql"
      operationId: "executeSelectSql"
      requestBody:
        content:
          application/json:
            schema:
              type: "string"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Result"
  /admController/executeUpdateSql:
    post:
      summary: "POST admController/executeUpdateSql"
      operationId: "executeUpdateSql"
      requestBody:
        content:
          application/json:
            schema:
              type: "string"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Result"
  /admController/getTableInfo:
    get:
      summary: "GET admController/getTableInfo"
      operationId: "getTableInfo"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Result"
components:
  schemas:
    Object:
      type: "object"
      properties: { }
    Result:
      type: "object"
      properties:
        statusCode:
          type: "integer"
          format: "int32"
        code:
          type: "string"
        list:
          $ref: "#/components/schemas/Object"
        message:
          type: "string"